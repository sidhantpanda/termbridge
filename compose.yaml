services:
  termbridge:
    container_name: termbridge
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - COUCHDB_HOST=${COUCHDB_HOST}
      - COUCHDB_PORT=${COUCHDB_PORT}
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASS=${COUCHDB_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT}
      - PG_USER=${PG_USER}
      - PG_PASS=${PG_PASS}
      - PG_DB=${PG_DB}
    ports:
      - 3000:3000

