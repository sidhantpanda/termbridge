services:
  termbridge:
    container_name: ghcr.io/sidhantpanda/termbridge
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - PG_HOST=${PG_HOST}
      - PG_PORT=${PG_PORT}
      - PG_USER=${PG_USER}
      - PG_PASS=${PG_PASS}
      - PG_DB=${PG_DB}
    ports:
      - 3000:3000

